<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 50px;
        font-weight: 800;
        fill: url(#title-grad);
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 20px;
        font-weight: 500;
        fill: #e2e8f0;
      }
      .tagline-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 15px;
        font-weight: 400;
        fill: #94a3b8;
      }
      .pulse-circle {
        animation: pulse 3s infinite ease-in-out;
      }
      .dash-line {
        stroke-dasharray: 8 6;
        animation: dash 20s linear infinite;
      }
      .orbit-node {
        animation: orbit 12s linear infinite;
        transform-origin: 1000px 175px;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.15); opacity: 0.9; }
      }
      @keyframes dash {
        to { stroke-dashoffset: -100; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Decorative Grid Lines -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="200" y1="0" x2="200" y2="350" />
    <line x1="400" y1="0" x2="400" y2="350" />
    <line x1="600" y1="0" x2="600" y2="350" />
    <line x1="800" y1="0" x2="800" y2="350" />
    <line x1="1000" y1="0" x2="1000" y2="350" />
  </g>

  <!-- Dynamic / Background Graphic Elements (Pushed behind foreground text) -->
  <g opacity="0.35">
    <path d="M 800 250 Q 900 100 1050 175 T 1180 80" fill="none" stroke="#6366f1" stroke-width="3" class="dash-line"/>
    <path d="M 750 120 Q 920 280 1100 150" fill="none" stroke="#38bdf8" stroke-width="2" class="dash-line"/>
    
    <!-- Network Graph Nodes on Right Side -->
    <circle cx="950" cy="120" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <circle cx="1050" cy="175" r="24" fill="#1e293b" stroke="#818cf8" stroke-width="3" />
    <circle cx="900" cy="240" r="15" fill="#1e293b" stroke="#c084fc" stroke-width="3" />
    <circle cx="1120" cy="260" r="20" fill="#1e293b" stroke="#34d399" stroke-width="3" />

    <line x1="950" y1="120" x2="1050" y2="175" stroke="#818cf8" stroke-width="2" opacity="0.7"/>
    <line x1="900" y1="240" x2="1050" y2="175" stroke="#818cf8" stroke-width="2" opacity="0.7"/>
    <line x1="1050" y1="175" x2="1120" y2="260" stroke="#34d399" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- Glowing Accent Orbs in far background -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1050" cy="200" r="150" fill="#c084fc" opacity="0.1" filter="url(#glow)"/>

  <!-- Foreground Title and Subtitle Block (Guaranteed clear visibility) -->
  <g transform="translate(80, 0)">
    <!-- Category Badge -->
    <rect x="0" y="55" width="230" height="32" rx="16" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <text x="15" y="76" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#818cf8">📊 MLOPS &amp; ML METADATA</text>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text">Awesome ML Metadata Store</text>

    <!-- Subtitle -->
    <text x="0" y="195" class="subtitle-text">Curated Ecosystem of SaaS Platforms &amp; Open-Source Tools</text>

    <!-- Tagline / Keywords -->
    <text x="0" y="240" class="tagline-text">🧪 Experiment Tracking  •  🏷️ Model Registry  •  🌿 Lineage  •  🔍 AI Observability</text>
    <text x="0" y="265" class="tagline-text">⚡ MLflow • Weights &amp; Biases • ClearML • Arize Phoenix • DVC • Metaflow</text>

    <!-- Footer Stats / Details -->
    <g transform="translate(0, 295)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#0f172a" opacity="0.8"/>
      <text x="10" y="17" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="600">🌟 Top Frameworks</text>
      
      <rect x="140" y="0" width="140" height="26" rx="6" fill="#0f172a" opacity="0.8"/>
      <text x="150" y="17" font-family="sans-serif" font-size="12" fill="#34d399" font-weight="600">⚡ Updated 2026</text>
    </g>
  </g>
</svg>
